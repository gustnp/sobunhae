<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, runTransaction, updateDoc, increment, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// 파이어베이스 기본 설정 (원본 유지)
const firebaseConfig = {
  apiKey: "AIzaSyBDmMnZeSK9k6RMfU0uIRDQ8Hbj-HLhYL8",
  authDomain: "sobunhae.firebaseapp.com",
  projectId: "sobunhae",
  storageBucket: "sobunhae.firebasestorage.app",
  messagingSenderId: "1076905142580",
  appId: "1:1076905142580:web:2ae1f34f7f822b32435d61"
};

const TAGS = ["신선/냉동", "간식/과자", "생활용품", "유아/키즈", "건강/영양", "반려동물", "주방/가전", "기타"];
const wonNum = (n) => Math.round(n).toLocaleString("ko-KR");
const el = (sel) => document.querySelector(sel);
function esc(str) { return String(str ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c])); }
function safeHref(url) { const s = String(url || "").trim(); return /^https?:\/\//i.test(s) ? s : "#"; }

let app, db, storage, auth;
let deals = [], currentUid = null, statusFilter = "all", tagFilter = "all", currentView = "list";
let joinedMap = JSON.parse(localStorage.getItem("sobunhae_joined") || "{}");
let selectedTags = [];
let formLocation = null, formPhotoUrl = null, formPhotoUploading = false;
let kakaoReady = false, formMap, formMarker, formGeocoder, feedMap, feedMarkers = [];
let targetJoinDealId = null;

if (window.kakao && window.kakao.maps) { window.kakao.maps.load(() => { kakaoReady = true; }); }

try {
  app = initializeApp(firebaseConfig);
  db = getFirestore(app); storage = getStorage(app); auth = getAuth(app);
  onAuthStateChanged(auth, (user) => { currentUid = user ? user.uid : null; });
  signInAnonymously(auth).catch(()=>{});
} catch (e) { console.error("Firebase Init Error"); }

function saveJoinedMap() { try { localStorage.setItem("sobunhae_joined", JSON.stringify(joinedMap)); } catch (e) {} }
function locOf(d) { return (d.location && typeof d.location === "object") ? d.location : { name: d.location || "위치 미상", lat: null, lng: null }; }
function unitsOf(p) { return p.units || 1; }
function filledOf(d) { return (d.participants || []).reduce((sum, p) => sum + unitsOf(p), 0); }

/* UI 초기화 */
el("#statusChips").innerHTML = [["all", "전체"], ["open", "모집중"], ["matched", "모집완료"]].map(([k, label]) => 
  `<button data-status="${k}" class="status-chip text-xs font-semibold rounded-full px-4 py-2 border border-kraft bg-white transition">${label}</button>`
).join("");

el("#tagFilter").innerHTML = `<option value="all">태그 전체</option>` + TAGS.map((t) => `<option value="${t}">#${t}</option>`).join("");

function renderStatusChips() {
  document.querySelectorAll(".status-chip").forEach((b) => {
    const on = b.dataset.status === statusFilter;
    b.className = `status-chip text-xs font-semibold rounded-full px-4 py-2 border transition ${on ? "bg-ink text-white border-ink shadow-md" : "bg-white text-ink border-kraft"}`;
  });
}
renderStatusChips();
document.querySelectorAll(".status-chip").forEach((b) => b.addEventListener("click", () => { statusFilter = b.dataset.status; renderStatusChips(); render(); }));
el("#tagFilter").addEventListener("change", (e) => { tagFilter = e.target.value; render(); });
el("#locFilter").addEventListener("input", render);

document.querySelectorAll(".view-btn").forEach((b) => b.addEventListener("click", () => {
  currentView = b.dataset.view;
  document.querySelectorAll(".view-btn").forEach((btn) => btn.className = `view-btn text-xs font-semibold px-4 py-2 transition ${btn.dataset.view === currentView ? "bg-ink text-white" : "bg-white text-ink"}`);
  render();
}));

/* 모달 로직 */
el("#openFormBtn").addEventListener("click", () => {
  el("#formModal").classList.remove("hidden"); el("#formModal").classList.add("flex");
  
  // [개선] Geolocation API 활용 위치 자동 입력 편의성 증대
  if (navigator.geolocation && kakaoReady && !formLocation) {
    el("#f_locSearch").placeholder = "현재 위치 확인 중...";
    navigator.geolocation.getCurrentPosition((pos) => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      ensureFormMap(lat, lng);
      reverseGeocodeToForm(lat, lng);
      el("#f_locSearch").value = "현재 내 위치 기준";
    }, () => {
      el("#f_locSearch").placeholder = "동 이름 검색";
    }, { timeout: 4000 });
  }
});
el("#closeFormBtn").addEventListener("click", () => { el("#formModal").classList.add("hidden"); el("#formModal").classList.remove("flex"); });
el("#closeJoinBtn").addEventListener("click", () => { el("#joinModal").classList.add("hidden"); el("#joinModal").classList.remove("flex"); });

/* 위치 검색 */
function ensureFormMap(lat, lng) {
  const mapEl = el("#f_map"); mapEl.classList.remove("hidden");
  const center = new kakao.maps.LatLng(lat, lng);
  if (!formMap) {
    formMap = new kakao.maps.Map(mapEl, { center, level: 4 });
    formGeocoder = new kakao.maps.services.Geocoder();
    formMarker = new kakao.maps.Marker({ position: center, map: formMap, draggable: true });
    kakao.maps.event.addListener(formMarker, "dragend", () => { const pos = formMarker.getPosition(); reverseGeocodeToForm(pos.getLat(), pos.getLng()); });
  } else {
    formMap.relayout(); formMap.setCenter(center); formMarker.setPosition(center);
  }
}
function reverseGeocodeToForm(lat, lng) {
  formGeocoder.coord2Address(lng, lat, (result, status) => {
    let name = `선택된 위치`;
    if (status === kakao.maps.services.Status.OK && result[0]) {
      const addr = result[0].address; name = addr.region_3depth_name || addr.region_2depth_name || addr.address_name;
    }
    formLocation = { name, lat, lng };
    el("#f_locResult").textContent = `📍 ${name}`; el("#f_locResult").classList.remove("hidden");
  });
}
el("#f_locSearchBtn").addEventListener("click", () => {
  const query = el("#f_locSearch").value.trim();
  if (!query || !kakaoReady) return;
  const geocoder = new kakao.maps.services.Geocoder();
  geocoder.addressSearch(query, (res, status) => {
    if (status === kakao.maps.services.Status.OK) {
      ensureFormMap(Number(res[0].y), Number(res[0].x)); reverseGeocodeToForm(Number(res[0].y), Number(res[0].x));
    } else {
      el("#f_locError").textContent = "위치를 찾지 못했어요. (예: 정자동)"; el("#f_locError").classList.remove("hidden");
    }
  });
});

/* 데이터 서밋 */
el("#submitFormBtn").addEventListener("click", async () => {
  const productName = el("#f_product").value.trim();
  const totalPrice = Number(el("#f_price").value);
  const targetCount = Number(el("#f_target").value);
  const nickname = el("#f_nickname").value.trim();
  
  if (!productName || !totalPrice || !formLocation || !nickname) {
    el("#formError").textContent = "필수 항목을 모두 채워주세요."; el("#formError").classList.remove("hidden"); return;
  }
  
  // [개선] 지연 수집 항목 제외 (기본값 세팅)
  const deal = {
    product: productName, productName, totalPrice, targetCount, location: formLocation,
    meetMethod: "협의", contactLink: "", settlementMethod: "협의", bankAccount: "", tags: [],
    hostUid: currentUid, participants: [{ nickname, units: 1, received: false, uid: currentUid }], status: "open",
    createdAt: Date.now(), priceCheckedAt: Date.now(), photoUrl: formPhotoUrl || null
  };
  
  const ref = await addDoc(collection(db, "deals"), deal);
  joinedMap[ref.id] = nickname; saveJoinedMap();
  el("#closeFormBtn").click();
  document.querySelectorAll("#formFields input").forEach(i => i.value = "");
});

/* [개선] 1. 쿠팡 파트너스 배너 컴플라이언스 및 네이티브 구조 반영 */
function keywordBannerSlot(keyword, imgUrl, linkUrl) {
  return `
  <a href="${safeHref(linkUrl)}" target="_blank" rel="noopener" class="block rounded-2xl border border-kraft bg-white overflow-hidden shadow-sm hover:shadow-md transition">
    <div class="flex items-center gap-4 p-4">
      <img src="${esc(imgUrl)}" alt="추천 상품" class="rounded-xl object-cover" style="width:72px; height:72px; flex-shrink:0;" loading="lazy" />
      <div class="flex-1 min-w-0">
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-600 text-white tracking-wide inline-block mb-1">로켓배송 추천</span>
        <p class="text-base font-bold text-ink truncate">쿠팡에서 ${esc(keyword)} 최저가 확인하기</p>
        <p class="text-xs text-[#8A8064] mt-1">빠른 배송으로 대용량 상품을 만나보세요.</p>
      </div>
    </div>
    <!-- 컴플라이언스 준수 필수 문구 삽입 -->
    <div class="bg-gray-50 px-4 py-2 border-t border-kraft">
        <p class="text-[9.5px] text-[#8A8064] text-right">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
    </div>
  </a>`;
}

/* 카드 렌더링 */
function dealCard(d) {
  // [개선] 1-2. 네이티브 딜 (데이터베이스에 isCoupangAffiliate가 true일 때 발동)
  if(d.isCoupangAffiliate) {
    const fakeSegs = Array.from({ length: 8 }).map((_, i) => `<div class="division-seg ${i < 6 ? "filled" : ""}"></div>`).join("");
    return `
    <div class="rounded-2xl flex flex-col bg-white border-2 border-blue-500 shadow-md overflow-hidden">
      <div class="p-5 flex flex-col gap-3">
        <div class="flex items-start gap-3 min-w-0">
          <img src="${esc(d.photoUrl || 'https://via.placeholder.com/64')}" class="rounded-xl object-cover" style="width:64px; height:64px; flex-shrink:0;" />
          <div class="min-w-0 flex-1">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 tracking-wide mb-1 inline-block">🚀 마감 임박 강력 추천</span>
            <h3 class="text-base font-display font-extrabold text-ink leading-snug">${esc(d.product)}</h3>
          </div>
        </div>
        <div class="flex gap-1">${fakeSegs}</div>
        <div class="flex items-baseline gap-2">
          <span class="text-3xl font-extrabold text-blue-600"><span class="font-mono">${wonNum(d.totalPrice / d.targetCount)}</span>원</span>
          <span class="text-[10px] text-[#8A8064]">/ 1인 체감가 (총액 기준)</span>
        </div>
        <a href="${safeHref(d.affiliateLink)}" target="_blank" rel="noopener" class="text-center w-full bg-blue-600 text-white py-3.5 rounded-xl text-sm font-bold shadow-md hover:bg-blue-700 transition">쿠팡 로켓배송으로 즉시 구매하기</a>
        <p class="text-[9px] text-[#8A8064] w-full text-center">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
      </div>
    </div>`;
  }

  // 일반 소분 카드 로직
  const perPerson = d.totalPrice / d.targetCount;
  const filled = filledOf(d);
  const remaining = d.targetCount - filled;
  const matched = d.status === "matched";
  const alreadyIn = !!joinedMap[d.id];
  const segs = Array.from({ length: Math.min(d.targetCount, 12) }).map((_, i) => `<div class="division-seg ${i < filled ? `filled ${matched ? "matched" : ""}` : ""}"></div>`).join("");
  
  // [개선] 3. 디자인 위계 재정리 - 모달 트리거 버튼으로 변경
  const ctaBlock = matched ? (alreadyIn ? 
    `<div class="p-3 bg-bg rounded-xl text-center text-accent2 font-bold text-sm">참여 완료! 호스트의 연락을 기다려주세요.</div>` : 
    `<div class="p-3 bg-gray-100 rounded-xl text-center text-[#8A8064] font-bold text-sm">인원이 마감되었습니다.</div>`
  ) : alreadyIn ? 
    `<div class="p-3 bg-bg rounded-xl text-center text-accent font-bold text-sm">현재 파티에 참여 중입니다.</div>` : 
    `<button class="open-join-btn w-full bg-accent text-white py-3.5 rounded-xl text-base font-bold shadow-md hover:brightness-110 transition" data-id="${d.id}" data-rem="${remaining}">이 소분 참여하기</button>`;

  return `
  <div class="rounded-2xl flex flex-col bg-white border border-kraft shadow-sm overflow-hidden ${matched ? "card-stripe-matched" : "card-stripe-open"}">
    <div class="p-5 flex flex-col gap-4">
      <div class="flex items-start justify-between gap-2">
        <h3 class="text-lg font-display font-black leading-snug text-ink flex-1 break-keep">${esc(d.product)}</h3>
        <span class="text-xs font-bold whitespace-nowrap text-[#6E6650] bg-bg px-2.5 py-1 rounded-lg">${matched ? "모집 완료" : `${filled}/${d.targetCount}명`}</span>
      </div>
      <div class="flex gap-1 -mt-1">${segs}</div>
      
      <!-- [개선] 3-2. 경제적 이득(1인 가격) 폰트 극대화, 총액 시각 분산 방지 -->
      <div class="flex items-end gap-2 mt-1">
        <span class="text-3xl font-black text-accent tracking-tighter"><span class="font-mono">${wonNum(perPerson)}</span>원</span>
        <span class="text-xs text-[#8A8064] opacity-70 mb-1">/ 1인 (총액 <span class="font-mono">${wonNum(d.totalPrice)}</span>원)</span>
      </div>
      
      <div class="flex items-center gap-2 text-xs font-semibold text-[#6E6650] bg-[#F9F8F5] p-2.5 rounded-lg">
        <span>📍 ${esc(locOf(d).name)}</span>
      </div>
      
      ${ctaBlock}
    </div>
  </div>`;
}

function render() {
  const feedEl = el("#feed"), statusEl = el("#feedStatus");
  const filtered = deals.filter(d => statusFilter === "all" ? true : d.status === statusFilter)
                        .filter(d => tagFilter === "all" ? true : (d.tags || []).includes(tagFilter));

  if (filtered.length === 0) {
    feedEl.innerHTML = ""; statusEl.classList.remove("hidden");
    statusEl.innerHTML = `<p class="text-sm text-[#8A8064]">조건에 맞는 소분이 없어요.</p>`; return;
  }
  
  statusEl.classList.add("hidden");
  
  // 강제로 쿠팡 네이티브 광고 삽입용 임시 더미 객체 (실제 운영시 Firestore에서 isCoupangAffiliate 필드로 인젝션)
  const sampleCoupangDeal = {
    isCoupangAffiliate: true, product: "크리넥스 3겹 데코앤소프트 30롤", photoUrl: "https://thumbnail8.coupangcdn.com/thumbnails/remote/230x230ex/image/retail/images/2020/07/28/15/4/c12e8412-f198-4c6e-8260-6b6de5fb1178.jpg",
    totalPrice: 28900, targetCount: 10, affiliateLink: "https://coupa.ng/abcdef"
  };

  feedEl.innerHTML = filtered.map((d, i) => {
    // 세 번째 게시글마다 기존 배너 대신 네이티브 딜이나 쿠팡 배너 삽입
    let injectAd = (i === 1) ? dealCard(sampleCoupangDeal) : (i === 3) ? keywordBannerSlot('휴지', 'https://via.placeholder.com/72', 'https://coupa.ng/1234') : "";
    return dealCard(d) + injectAd;
  }).join("");

  // [개선] 2-2. 인라인 폼 대신 모달 오픈 트리거 바인딩
  feedEl.querySelectorAll(".open-join-btn").forEach(btn => btn.addEventListener("click", () => {
    targetJoinDealId = btn.dataset.id;
    const rem = Number(btn.dataset.rem);
    el("#j_units").innerHTML = Array.from({length: rem}).map((_,i)=>`<option value="${i+1}">${i+1}인분</option>`).join("");
    el("#joinModal").classList.remove("hidden"); el("#joinModal").classList.add("flex");
  }));
}

/* 참여 확정 모달 로직 */
el("#submitJoinBtn").addEventListener("click", async () => {
  const nickname = el("#j_nickname").value.trim();
  const units = Number(el("#j_units").value);
  if(!nickname) { el("#joinError").textContent = "닉네임을 입력해주세요."; el("#joinError").classList.remove("hidden"); return; }
  
  const ref = doc(db, "deals", targetJoinDealId);
  await runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);
    const data = snap.data();
    const filled = filledOf(data);
    const newParticipants = [...data.participants, { nickname, units, received: false }];
    tx.update(ref, { participants: newParticipants, status: (filled+units) >= data.targetCount ? "matched" : "open" });
  });
  
  joinedMap[targetJoinDealId] = nickname; saveJoinedMap();
  el("#closeJoinBtn").click(); el("#j_nickname").value = "";
});

// 실시간 구독 리스너 시작
if(db) {
  onSnapshot(query(collection(db, "deals"), orderBy("createdAt", "desc"), limit(30)), (snap) => {
    deals = snap.docs.map(d => ({id: d.id, ...d.data()})); render();
  });
}
</script>
</body>
</html>
